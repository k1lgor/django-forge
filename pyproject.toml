[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-django"
version = "0.4.0"
description = "Scaffold production-ready Django projects with senior-architect best practices"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["django", "scaffold", "boilerplate", "cli", "uv"]
authors = [
    { name = "Plamen Ivanov", email = "paco.iwanow@gmail.com" },
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
    "jinja2>=3.1,<4.0",
    "tomli>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1.0",
    "ty>=0.0.35,<1.0",
    "pytest>=8.0,<9.0",
    "tomli>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "django-allauth>=65,<66",
    "django-ninja>=1.4,<2",
    "djangorestframework>=3.15,<4",
    "django-cors-headers>=4.7,<5",
    "whitenoise>=6.9,<7",
    "pydantic-settings>=2.8,<3",
    "dj-database-url>=3,<4",
]

[project.urls]
Homepage = "https://github.com/k1lgor/django-forge"
Source = "https://github.com/k1lgor/django-forge"
Changelog = "https://github.com/k1lgor/django-forge/blob/main/CHANGELOG.md"
Issues = "https://github.com/k1lgor/django-forge/issues"
Website = "https://github.com/k1lgor/django-forge"

[project.scripts]
forge-django = "django_forge.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty]
[tool.ty.environment]
python-version = "3.10"

[tool.setuptools.package-data]
django_forge = ["templates/**/*"]

[tool.setuptools.packages.find]
include = ["django_forge", "django_forge.*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

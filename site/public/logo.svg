<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="django-forge logo — an anvil with a rising flame">
  <defs>
    <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff4d2e"/>
      <stop offset="60%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ffd84d"/>
    </linearGradient>
    <linearGradient id="anvilGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38e1e1"/>
      <stop offset="100%" stop-color="#1c8a8a"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffd84d"/>
      <stop offset="100%" stop-color="#fff3b0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#0d1117" stroke="#232a3a" stroke-width="10"/>

  <!-- sparks -->
  <circle cx="300" cy="120" r="7" fill="#ffd84d" opacity="0.9"/>
  <circle cx="212" cy="104" r="5" fill="#ff8a3d" opacity="0.85"/>
  <circle cx="346" cy="164" r="4.5" fill="#ffd84d" opacity="0.7"/>

  <!-- outer flame -->
  <path d="M256 96 C 308 148 322 196 256 236 C 190 196 204 148 256 96 Z" fill="url(#flameGrad)"/>
  <!-- inner core -->
  <path d="M256 138 C 282 168 288 192 256 214 C 224 192 230 168 256 138 Z" fill="url(#coreGrad)"/>

  <!-- anvil: horn (left point) -->
  <path d="M162 246 Q 96 236 78 296 Q 132 302 158 262 Z" fill="url(#anvilGrad)"/>
  <!-- anvil: top bar -->
  <rect x="150" y="232" width="212" height="44" rx="10" fill="url(#anvilGrad)"/>
  <!-- anvil: neck -->
  <rect x="226" y="276" width="60" height="44" fill="url(#anvilGrad)"/>
  <!-- anvil: base -->
  <path d="M168 320 L 344 320 L 312 412 L 200 412 Z" fill="url(#anvilGrad)"/>
  <!-- base highlight line -->
  <rect x="200" y="404" width="112" height="8" rx="4" fill="#0d1117" opacity="0.35"/>
</svg>
